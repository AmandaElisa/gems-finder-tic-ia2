# Tema claro do Gems Finder — mesma paleta do protótipo HTML.
[theme]
base = "light"
primaryColor = "#1DB954"
backgroundColor = "#FAF6EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141414"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
headingFont = "Fredoka:https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"

[browser]
gatherUsageStats = false
